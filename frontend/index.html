<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Distillation Watchdog</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Crect width='18' height='18' rx='4' fill='%2308090a'/%3E%3Ccircle cx='9' cy='9' r='5.5' fill='none' stroke='%23f3f3f1' stroke-width='1.5'/%3E%3Cpath d='M9 9V3.5A5.5 5.5 0 0 1 14.5 9Z' fill='%23f3f3f1'/%3E%3C/svg%3E"
    />
    <script>
      // Set the theme before the first paint. Dark is the default; a saved choice wins.
      try {
        var t = localStorage.getItem("dw-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
