# Distillation Watchdog configuration. Every tunable number is here.

models:
  lab_model: qwen/qwen3-coder-next
  helper_model: qwen/qwen3-coder-30b-a3b-instruct

llm:
  base_url: https://openrouter.ai/api/v1
  max_parallel: 16
  max_retries: 3
  timeout_s: 120
  cache_dir: cache/llm
  cost_log: reports/llm_cost.json
  data_collection_deny: true

ports:
  lab: 8000
  normal_gen: 8001
  attack_gen: 8002
  agent: 8003
  watchdog: 8010

paths:
  data: data
  raw: data/raw
  canonical: data/canonical
  splits: data/splits
  synth: data/synth
  timing_fit: data/timing_fit.json
  models: models
  reports: reports
  cache: cache
  sqlite: data/watchdog_events.sqlite
  agent_workspace: agent_workspace
  agent_tool_venv: cache/agent_venv   # python + pytest for the agent shell (made by scripts/demo.sh)

privacy:
  salt_env: DW_SALT            # optional env override
  default_salt: dw-hackathon-salt-v1

fetch:
  swechat_agent: "Claude Code"   # exact string in sessions.agent (12,417 sessions)
  openswe_config: v2.0
  openswe_split: claudecode
  openswe_xharness_split: sweagent
  openswe_rows: 12000
  openswe_xharness_rows: 800
  duckdb_memory: 3GB             # memory limit for the SWE-chat conversations query

normalize:
  max_tool_chars: 2000
  truncation_marker: "\n[...truncated...]"
  max_steps: 40
  ngram_source_min_frac: 0.30
  ngram_other_max_frac: 0.01
  ngram_top: 200
  ngram_max_rounds: 3
  ngram_sample: 2000            # sessions per source read by the n-gram mining
  ngram_pass1: 200              # sessions per source used to find candidate n-grams
  swechat_max_sessions: null    # null = all Claude Code sessions
  repo_root_min_cover: 0.6      # SWE-chat repo root: deepest folder that holds this share of file paths

split:
  seed: 1234
  train: 0.6
  val: 0.2
  holdout: 0.2
  timing_max_think_s: 21600     # user think gaps above 6 h are breaks, not think time
  timing_max_step_s: 600        # model and tool gaps above 10 min are not used in the fit

synth:
  fake_frac: 0.4
  fake_sessions: {train: 300, val: 100, holdout: 150}
  stealth_sessions: {train: 150, val: 100, holdout: 150}
  bank_size_elicit: 200
  bank_size_benign: 200
  bank_dedup_cos: 0.85
  seed_a: 11
  seed_b: 22
  seed: 5                       # selection of fake-env and stealth sessions
  context_chars: 1200           # chars of each context message in a fake-output prompt
  fake_max_tokens: 700
  bank_batch: 15                # items asked for in one bank generation call
  bank_overgen: 1.4             # generate this factor more items than needed, before dedup

sim:
  epoch_start: 1767571200      # 2026-01-05 00:00 UTC, simulation time origin
  speed: 600                   # one simulated hour = 6 real seconds
  max_in_flight: 64
  benign_explain_rate: 0.05
  scales:                      # accounts per persona
    small: {solo_dev: 8, saas_app: 1, benchmark_runner: 1, hydra: 12, fake_env: 4, stealth: 4}
    demo: {solo_dev: 40, saas_app: 3, benchmark_runner: 3, hydra: 60, fake_env: 15, stealth: 20}
    full: {solo_dev: 150, saas_app: 3, benchmark_runner: 10, hydra: 200, fake_env: 50, stealth: 40}
    # train: more benchmark runners (normal accounts on Open-SWE data), so that "Open-SWE" does not mean "attack"
    train: {solo_dev: 40, saas_app: 3, benchmark_runner: 8, hydra: 60, fake_env: 15, stealth: 20}
  sim_days: {small: 1, demo: 2, full: 3, train: 2}
  personas:
    solo_dev:
      temperature: [0.0, 1.0]
      sessions_per_account: [2, 8]
      retry_rate: [0.0, 0.25]   # per account: network retries and "regenerate" clicks
      effort_rate: 0.15
      cap_rate: 0.10
    saas_app:
      sessions_per_account: [80, 160]
      end_users_per_account: [20, 60]
      temperature: [0.2, 0.7]
      retry_rate: [0.02, 0.15]
      effort_rate: 0.05
      cap_rate: 0.05
      product_template: "[DevPilot] Customer request from the DevPilot web app:\n{prompt}\n\nAnswer as the DevPilot coding assistant."
    benchmark_runner:
      tasks_per_account: 50      # benchmark tasks per account
      attempts: [1, 3]
      temperature: [0.0, 0.8]
      quota: 20000
      retry_rate: [0.0, 0.10]
      effort_rate: 0.30
      cap_rate: 0.30
    hydra:
      best_of_n: [4, 8]
      temperature: [0.6, 1.0]
      effort_rate: 0.7
      cap_rate: 0.6
      elicit_rate: 0.6
      start_jitter_s: 90
      cron_interval_s: 3600     # time between synchronized start waves
      sessions_per_account: [3, 8]
    fake_env:
      best_of_n: [2, 4]
      temperature: [0.5, 1.0]
      effort_rate: 0.6
      cap_rate: 0.5
      elicit_rate: 0.5
      start_jitter_s: 90
      cron_interval_s: 3600
      sessions_per_account: [3, 8]
    stealth:
      best_of_n: 1
      retry_rate: [0.05, 0.30]  # per account; overlaps the normal personas (R1-H1)
      effort_rate: 0.2
      cap_rate: 0.15
      temperature: [0.3, 0.9]
      elicit_rate: 0.15
      swechat_mix: 0.3
      followups: [1, 2]
      sessions_per_account: [3, 8]
      timing_jitter: 0.2        # +- change of the lognormal mu per account (human timing)
  normal_max_tokens: [1024, 8192]
  max_tokens_cap: 32768
  train_randomization: 0.3      # +- fraction applied to persona ranges in training scenarios
  copy_spread_s: 2.0            # best-of-n copies of one request arrive within this time
  bench_gap_s: [5, 30]          # gap between benchmark sessions
  send_timeout_s: 30
  client_pool: 16               # httpx clients that share max_in_flight (one big pool is slow)

lab:
  ingest_interval_s: 0.2
  ingest_buffer_max: 20000
  blocklist_interval_s: 0.5    # block list poll. With rescore_interval_s, the delay from a decided block to the first 403
  stats_window: 5000            # handle() latencies kept for p50/p95
  rps_window_s: 5.0             # time window for requests per second
  load_client_procs: 4          # load test client processes (one Python client is slower than the lab)

watchdog:
  queue_max: 50000
  sqlite_flush_s: 1.0
  rescore_interval_s: 0.5      # rescores only the accounts with new requests, so a shorter interval adds little work
  campaign_interval_s: 10.0
  offline_rescore_every: 200     # events between rescoring in offline mode
  offline_campaign_every: 1000   # events between campaign runs in offline mode
  memory_events: 200000         # recent events kept in memory for evidence lookup
  ingest_chunk: 200              # events per worker step before it yields to the event loop
  rate_bucket_s: 60              # sim-time bucket of the rate history
  rate_history_max: 240          # buckets kept
  history_max: 300               # score history points per account
  evidence_per_account_max: 2000
  evidence_list_max: 200         # evidence items in GET /api/accounts/{id}
  recent_blocks: 10
  sse_interval_s: 1.0
  term_interval_s: 1.0

detectors:
  embed_max_chars: 200          # bge-small on this CPU: about 40 texts/s at 200 chars, 3 texts/s at 2000
  embed_batch: 64
  embed_threads: 2              # ONNX threads; more threads spin on small per-request batches
  evidence_first: 3             # evidence items per account and kind: the first N ...
  evidence_every: 25            # ... and then every Mth item
  d1:
    high_temp: 0.9
    dup_evidence_min: 3         # evidence when one context reaches this copy count
  d2:
    correction_threshold: 0.75     # bge-small: corrections 0.68-0.90, other follow-ups 0.56-0.73
    return_gap_days: 1.0
    correction_prototypes:
      - "no, that is wrong"
      - "that did not work"
      - "this is still failing"
      - "you broke the tests"
      - "that is not what I asked for"
      - "revert that change"
      - "the error is still there"
      - "try a different approach"
      - "you misunderstood the problem"
      - "undo your last edit"
  d3:
    kmeans_k: 50
    kmeans_fit_n: 5000          # train first prompts sampled for the k-means fit (time limit)
    repo_jaccard: 0.2           # path-set similarity to join a session to a repository
    seed: 0
  d4:
    max_tokens_frac_of_cap: 0.99
    max_effort_values: [high, xhigh]
    elicit_threshold: 0.5       # a user message above this score counts as elicitation
    evidence_score: 0.8
    keyword_top: 20
    keyword_ngrams: [2, 4]
  d7:
    active_hour_min_requests: 1
    concurrency_window_s: 300
    hour_evidence_requests: 120 # evidence when one hour has this many requests

account:
  min_requests: 30
  block_max_fpr: 0.01
  review_max_fpr: 0.05
  logreg_C: 1.0
  class_weight: balanced
  model_groups: [d4]               # detector groups in the learned model. D1 = rules score, D7 = exoneration. D2, D3, D6 failed the validation check (D-49)
  snapshot_requests: [30, 60, 120, 250, 500, 1000]   # training rows: features at these request counts and at the end
  z_clip: 5.0                   # standardized feature values are clipped to +-5 (training and scoring)
  min_rel_std: 0.01             # features with a smaller training std (relative to max(1, |mean|)) are left out
  train_seeds: [101, 102, 103]
  val_seed: 201
  holdout_seed: 301

rules:
  feature: d1_dup_rate          # rules score: share of requests that repeat an earlier context of the account
  exonerate_min_users: 5        # D7: an account with this many distinct `user` values gets at most "review" from the rules
  file: rules.json              # thresholds from validation, in models/

campaign:
  candidate_threshold: 0.3
  min_size: 3
  sync_corr_min: 0.6
  edge_weights:
    shared_task: 1.0
    sync: 0.6
    rare_schema: 0.3
  min_edge_weight: 0.5
  louvain_seed: 7
  evidence_tasks: 3              # shared-task evidence items per campaign
  block_threshold: 1.5
  review_threshold: 1.0

agent:
  account_key: acct-human-demo
  max_steps: 25
  shell_timeout_s: 60
  output_max_chars: 10000
  temperature: 0.2
  max_tokens: 4096
  lab_timeout_s: 300            # agent wait for one lab response
  max_files_listed: 500

casefile:
  top_evidence: 15
  max_tokens: 1200
  temperature: 0.2
  top_contributions: 8

eval:
  scale: full                   # holdout scenario scale
  requests_per_day: 10000000
  load_requests: 5000
  load_concurrency: 64

train:
  scenario_scale: train         # scale of the train and validation scenarios
  full_stealth: true            # full stealth persona also in train and validation (source protection, R1-M2)
  prompt_chars: 1500
  elicit_prompts: 3000
  request_rows_max: 200000
  processes: 2                  # scenarios run in parallel processes (each needs up to 4.5 GB). More processes share cores and cost more CPU time.

controls:
  seed: 17
  probe_sessions_per_source: 2500   # sessions per source and split read by the format and prose probes
  probe_C: 1.0
  format_target_auc: 0.70
  top_features: 12                  # top format-probe coefficients in the report
  prose_max_chars: 6000             # assistant prose per session for the prose probe
  prose_max_features: 50000
  permutation_runs: 20               # a single shuffle can land far from 0.5; the mean must be near 0.5

context_model:                  # the text parts of D4 and D6 (dw/train/context_data.py, scripts/context_train.py)
  seed: 31
  call_chars: 300               # characters of the tool call line
  output_chars: 1500            # characters of the tool output
  prompt_chars: 1500            # characters of a user prompt
  realism_neg_ratio: 2          # real Open-SWE outputs per fake output (same tool kind)
  swechat_check: 3000           # real SWE-chat outputs in the check set (val, holdout)
  elicit_prompts: {train: 6000, val: 1000, holdout: 1500}
  wrapper_frac: 0.15            # share of prompts (both labels) inside the SaaS product wrapper
  model_tag: qwen3-0.6b-base-v2 # cache key: change it when the model or the input format changes
  url: http://127.0.0.1:9100    # scoring service through the SSH tunnel (scripts/context_tunnel.sh)
  batch: 256                    # texts per request to the service
  timeout_s: 120
  retry_s: 30                   # after a failed call, wait this long before the next try
  save_every: 5000              # new scores between disk-cache writes
  evidence_score: 0.9           # a text with this score or more becomes an evidence item
